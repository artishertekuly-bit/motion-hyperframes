<!doctype html>
<html lang="kk" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/characters/artur/artur-rig.js"></script>
    <script src="assets/songy/bg.js"></script>
    <script src="assets/courier/bg.js"></script>
    <script src="assets/courier/timing.js"></script>
    <script src="assets/common/reels-engine.js"></script>
    <script src="assets/courier/shots.js"></script>
    <style>
      :root { --font-display: "Montserrat", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0d16; }
      #root { position: absolute; inset: 0; overflow: hidden; background: #0b0d16; }
      #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; }
      #stage text { font-family: var(--font-display); }
      #fontwarm { position: absolute; left: -3000px; top: 0; font-family: var(--font-display); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="222" data-width="1080" data-height="1920">
      <div id="stage" class="clip" data-start="0" data-duration="222"></div>
      <div id="fontwarm"><b style="font-weight:900">КУРЬЕР АРТУР ҚАРБЫЗ ӘҒҚҢӨҰҮҺІ ✓ әғқңөұүһі «»—…</b><b style="font-weight:800">Аа</b><b style="font-weight:700">Аа</b></div>
    </div>
    <script>
      (function () {
        const DUR = Math.ceil((window.SONGY_T && window.SONGY_T.total) || 222);
        const stage = document.getElementById("stage");
        const engine = window.REELS || window.SONGY;
        const renderAt = (t) => engine.renderAt(Math.max(0, Math.min(DUR - 1 / 120, t)), stage);
        window.__renderAt = renderAt;
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__timelines = window.__timelines || {};
        const proxy = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(proxy.t) }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
