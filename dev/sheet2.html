<!doctype html>
<html><head><meta charset="utf-8"><title>sheet2</title>
<style>body{margin:0;background:#222;display:grid;grid-template-columns:repeat(2,960px);gap:0}
.c{position:relative;width:960px;height:540px;overflow:hidden}
.c iframe{width:1920px;height:1080px;border:0;transform:scale(0.5);transform-origin:0 0}
.c b{position:absolute;left:6px;top:4px;color:#ff0;font:700 22px monospace;text-shadow:0 0 3px #000}</style></head>
<body>
<script>
// 2×2 үлкен кадрлар: ?c=auyl&t=1,2,3,4
const qs = new URLSearchParams(location.search);
const ts = (qs.get("t") || "0").split(",").map(Number);
const comp = qs.get("c") || "auyl";
for (const t of ts) {
  const d = document.createElement("div"); d.className = "c";
  const f = document.createElement("iframe"); f.src = "../" + comp + ".html?t=" + t;
  f.onload = () => { try { f.contentWindow.__renderAt(t); } catch (e) { d.style.outline = "4px solid red"; } };
  d.appendChild(f); const b = document.createElement("b"); b.textContent = t.toFixed(1); d.appendChild(b);
  document.body.appendChild(d);
}
</script>
</body></html>
