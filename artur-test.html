<!doctype html>
<html lang="kk" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/characters/artur/artur-rig.js"></script>
    <style>
      /* Артур — қозғалыс тесті (7 с): бұрылу → «Сәлем! Мен — Артур» → қоңырау → шошу → иық көтеру → тақтада аты. */
      :root { --wall: #ddd3c5; --font-display: "Montserrat", sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--wall); }
      #root { position: absolute; inset: 0; background: var(--wall); overflow: hidden; }
      #scene { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
      #scene text { font-family: var(--font-display); }
      #fontwarm { position: absolute; left: -2000px; top: 0; font-family: var(--font-display); font-weight: 900; font-size: 20px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="7" data-width="1080" data-height="1920">
      <svg id="scene" viewBox="0 0 1080 1920"></svg>
      <div id="fontwarm">Сәлем! Мен — Артур. ӘҒҚҢӨҰҮҺІ</div>
      <audio id="sfx-whoosh" class="clip" data-start="0.66" data-track-index="2" data-volume="0.55" src="assets/characters/artur/test/whoosh.wav"></audio>
      <audio id="vo" class="clip" data-start="1.2" data-track-index="1" data-volume="1" src="assets/characters/artur/test/hello.mp3"></audio>
      <audio id="sfx-bell" class="clip" data-start="3.62" data-track-index="3" data-volume="0.42" src="assets/characters/artur/test/bell.wav"></audio>
      <audio id="sfx-boing" class="clip" data-start="3.8" data-track-index="4" data-volume="0.5" src="assets/characters/artur/test/boing.wav"></audio>
      <audio id="sfx-pop" class="clip" data-start="5.55" data-track-index="5" data-volume="0.5" src="assets/characters/artur/test/pop.wav"></audio>
    </div>
    <script>
      (function () {
        const R = window.ArturRig, E = R.EXPR, P = R.POSES;
        const DUR = 7;
        const svg = document.getElementById("scene");

        // ---------- уақыт құралдары ----------
        const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
        const EASE = {
          lin: (k) => k,
          io: (k) => (k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2),
          out: (k) => 1 - Math.pow(1 - k, 3),
          in: (k) => k * k * k,
          back: (k) => { const c = 1.9; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); },
        };
        // keys: [[t, value, ease]] — ease мәнге жету жолын білдіреді
        function key(t, keys) {
          if (t <= keys[0][0]) return keys[0][1];
          for (let i = 0; i < keys.length - 1; i++) {
            const [t0, v0] = keys[i], [t1, v1, e] = keys[i + 1];
            if (t <= t1) {
              const k = (EASE[e || "io"])(clamp((t - t0) / Math.max(1e-6, t1 - t0), 0, 1));
              return R.blend(v0, v1, k);
            }
          }
          return keys[keys.length - 1][1];
        }
        const S = (expr, extra) => JSON.parse(JSON.stringify(Object.assign({}, E[expr], extra || {})));
        const eyeMod = (expr, mod) => { const s = S(expr); Object.assign(s.eye, mod); return s; };

        // ---------- дауыс → ауыз (ElevenLabs әріп таймингтері) ----------
        const V0 = 1.2;
        const CH = [["С",0.16],["ә",0.20],["л",0.24],["е",0.35],["м",0.45],["!",0.56],[" ",0.72],["М",0.88],["е",1.00],["н",1.06],[" ",1.12],["—",1.28],[" ",1.31],["А",1.33],["р",1.36],["т",1.52],["у",1.60],["р",1.68],[".",1.76]];
        const SPEECH_END = V0 + 1.86;
        function visemeAt(t) {
          const tq = Math.floor(t * 15) / 15; // ауыз 15 к/с ауысады (қолмен салынған анимациядай)
          const lt = tq - V0;
          if (lt < 0.14 || tq > SPEECH_END) return null;
          let cur = null;
          for (let i = 0; i < CH.length; i++) if (CH[i][0] !== undefined && CH[i][1] <= lt) cur = CH[i][0];
          if (!cur || /[!.\s—]/.test(cur)) return lt > 0.56 && lt < 0.86 ? "smile" : "mbp";
          return R.letterViseme(cur);
        }

        // ---------- кадрлар ----------
        const lookBoard = eyeMod("calm", { px: -0.75, py: -0.15 });
        const proud = S("smug", { mouth: "smile" });
        const shyLaugh = S("happy", { mouth: "laugh" });
        shyLaugh.fx.blush = 0.8; shyLaugh.eye.lidBot = 0.4; shyLaugh.eye.lidTop = 0.18;
        const EXPRK = [
          [0, lookBoard], [0.95, lookBoard], [1.12, S("calm")], [1.3, S("happy")], [2.5, S("happy")], [2.66, proud],
          [3.72, proud], [3.8, S("shock"), "out"], [4.62, S("shock")], [4.8, S("scared")], [5.12, S("scared")], [5.3, shyLaugh], [7, shyLaugh],
        ];
        const BLINKS = [0.58, 2.06, 3.32, 6.3];
        const bodyTurn = [[0, -0.45], [0.78, -0.45], [1.06, 0, "back"], [7, 0]];
        const headAbs = [[0, -0.45], [0.7, -0.45], [0.94, 0.05, "out"], [1.12, 0], [4.55, 0], [4.72, 0.42, "out"], [5.02, 0.42], [5.18, 0, "io"], [7, 0]];
        const SQ = [[0, 1], [0.5, 1], [0.64, 0.962], [0.8, 1.018, "out"], [0.96, 1], [3.7, 1], [3.8, 0.9, "out"], [3.9, 1.1, "out"], [4.1, 1.03], [4.18, 0.9, "in"], [4.34, 1.025, "out"], [4.46, 1], [5.08, 1], [5.18, 0.97], [5.32, 1.02, "out"], [5.44, 1], [7, 1]];
        const JY = [[0, 0], [3.84, 0], [4.0, -74, "out"], [4.18, 0, "in"], [7, 0]];
        const TILT = [[0, 0], [0.62, 2], [1.0, 0], [1.3, -5], [2.2, -4], [2.4, 3], [3.4, 3], [3.8, 0], [5.15, 0], [5.4, 7, "out"], [7, 6]];
        const HY = [[0, 0], [0.5, 0], [0.64, 7], [0.82, -4, "out"], [0.98, 0], [3.7, 0], [3.8, 8], [3.92, -10, "out"], [4.2, 6], [4.36, 0], [7, 0]];
        const LEAN = [[0, 0], [3.8, 0], [3.96, -3], [4.22, 2.5], [4.42, 0], [7, 0]];
        const idle = { sh: 11, el: -7, hand: "rest" };
        const up = { sh: 152, el: 18, hand: "open" };
        const ARMR = [[0, idle], [1.0, idle], [1.3, { sh: 146, el: 30, hand: "open" }, "back"], [2.12, { sh: 138, el: 34, hand: "open" }],
          [2.36, { sh: 24, el: -142, hand: "point" }, "out"], [3.04, { sh: 24, el: -142, hand: "point" }], [3.36, idle], [3.78, idle],
          [3.9, up, "out"], [4.42, up], [4.72, idle], [5.14, idle], [5.4, P.shrug.armR, "back"], [7, P.shrug.armR]];
        const ARML = [[0, idle], [3.78, idle], [3.92, Object.assign({}, up, { sh: 156 }), "out"], [4.46, up], [4.76, idle], [5.18, idle], [5.44, P.shrug.armL, "back"], [7, P.shrug.armL]];
        const LEG = [[0, { a: 3, k: 0 }], [3.84, { a: 3, k: 0 }], [3.98, { a: 10, k: 0 }], [4.16, { a: 4, k: 0 }], [7, { a: 3, k: 0 }]];
        // камера: баяу жақындау → секіргенде дірілдеу → кері шегініп, тақтадағы атты ашу
        const CAM = [[0, 1.0], [3.6, 1.075, "io"], [4.5, 1.08], [5.7, 1.0, "io"], [7, 0.985, "io"]];
        const PAN = [[0, -26], [3.6, 6, "io"], [5.7, 0, "io"], [7, 14, "io"]];
        const FY = [[0, 820], [3.6, 760], [5.7, 900, "io"], [7, 900]];

        function characterAt(t) {
          let ex = key(t, EXPRK);
          ex = JSON.parse(JSON.stringify(ex));
          // көз жұму (шошу кезінде емес)
          for (const b of BLINKS) {
            const d = t - b;
            if (d >= 0 && d < 0.16) {
              const k = d < 0.06 ? d / 0.06 : d < 0.1 ? 1 : 1 - (d - 0.1) / 0.06;
              ex.eye.lidTop = Math.max(ex.eye.lidTop, k * (1 - ex.eye.lidBot));
            }
          }
          // шошығанда қарашық дірілдейді
          if (t > 3.82 && t < 4.6) {
            const q = Math.floor(t * 24);
            ex.eye.px = ((q * 37) % 7 - 3) * 0.05;
            ex.eye.py = ((q * 53) % 5 - 2) * 0.05;
          }
          const vis = visemeAt(t);
          const mouth = vis || ex.mouth;
          const turn = key(t, bodyTurn);
          const hAbs = key(t, headAbs);
          // демалыс: дене мен бас сәл тербеледі
          const breath = Math.sin(t * Math.PI * 2 * 0.45);
          const armR = key(t, ARMR), armL = key(t, ARML);
          const wave = t > 1.3 && t < 2.2 ? Math.sin((t - 1.3) * Math.PI * 2 * 3.1) * 22 * Math.min(1, (t - 1.3) / 0.15, (2.2 - t) / 0.15) : 0;
          return Object.assign({}, ex, {
            mouth,
            turn,
            headTurn: hAbs - turn,
            headTilt: key(t, TILT),
            headY: key(t, HY) + breath * 1.6,
            lean: key(t, LEAN),
            squash: key(t, SQ) * (1 + breath * 0.005),
            y: key(t, JY),
            armR: Object.assign({}, armR, { el: armR.el + wave }),
            armL,
            legL: key(t, LEG),
            legR: key(t, LEG),
            outfit: "grad",
          });
        }

        // ---------- фон (статикалық қабаттар) ----------
        const INK = R.INK;
        const chalk = (d, w, op) => `<path d="${d}" fill="none" stroke="#f4f1e6" stroke-width="${w || 7}" stroke-linecap="round" stroke-linejoin="round" opacity="${op || 0.82}"/>`;
        function farLayer() {
          let s = "";
          s += `<rect x="-300" y="-300" width="1680" height="2000" fill="#ddd3c5"/>`;
          s += `<rect x="-300" y="1240" width="1680" height="420" fill="#c9a99a"/>`;
          s += `<line x1="-300" y1="1240" x2="1380" y2="1240" stroke="${INK}" stroke-width="6"/>`;
          // тақта
          s += `<rect x="70" y="430" width="940" height="600" rx="10" fill="#8a6a4b" stroke="${INK}" stroke-width="7"/>`;
          s += `<rect x="98" y="458" width="884" height="544" fill="#3a5b4b" stroke="${INK}" stroke-width="5"/>`;
          s += `<rect x="150" y="1022" width="780" height="20" rx="6" fill="#8a6a4b" stroke="${INK}" stroke-width="5"/>`;
          s += `<rect x="600" y="1012" width="44" height="12" rx="4" fill="#fff" stroke="${INK}" stroke-width="3"/>`;
          // бор суреттері: «11», сағат, жұлдыз, куб
          s += chalk("M170,640 L205,600 L205,800 M168,800 L242,800", 9);
          s += chalk("M270,640 L305,600 L305,800 M268,800 L342,800", 9);
          s += `<circle cx="850" cy="560" r="62" fill="none" stroke="#f4f1e6" stroke-width="6" opacity="0.8"/>` + chalk("M850,560 L850,520 M850,560 L880,575", 6);
          s += chalk("M820,800 L840,850 L895,852 L852,884 L868,936 L820,905 L773,936 L789,884 L746,852 L801,850 Z", 5, 0.75);
          s += chalk("M380,880 L460,880 L460,960 L380,960 Z M380,880 L410,850 L490,850 L460,880 M490,850 L490,930 L460,960", 5, 0.7);
          // қабырға сағаты
          s += `<circle cx="930" cy="250" r="64" fill="#fff" stroke="${INK}" stroke-width="7"/><path d="M930,250 L930,205 M930,250 L962,262" stroke="${INK}" stroke-width="6" stroke-linecap="round"/>`;
          // еден
          s += `<rect x="-300" y="1620" width="1680" height="600" fill="#a99482"/>`;
          s += `<line x1="-300" y1="1620" x2="1380" y2="1620" stroke="${INK}" stroke-width="7"/>`;
          for (let i = 0; i < 9; i++) s += `<line x1="${-200 + i * 190}" y1="1620" x2="${-420 + i * 260}" y2="1990" stroke="#8f7b6a" stroke-width="4"/>`;
          return s;
        }
        // тақтадағы ат: бормен жазылады (5.5–6.4 с)
        const NAME = [
          "M0,140 L50,0 L100,140 M24,86 L76,86",
          "M0,140 L0,0 L58,0 Q98,0 98,38 Q98,76 58,76 L0,76",
          "M0,0 L100,0 M50,0 L50,140",
          "M0,0 L52,84 M100,0 L38,140",
          "M0,140 L0,0 L58,0 Q98,0 98,38 Q98,76 58,76 L0,76",
        ];
        function nameAt(t) {
          const t0 = 5.5, per = 0.17;
          let s = "";
          NAME.forEach((d, i) => {
            const k = clamp((t - t0 - i * per) / 0.22, 0, 1);
            if (k <= 0) return;
            s += `<path d="${d}" transform="translate(${124 + i * 80},${484}) scale(0.6)" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${(100 * (1 - EASE.out(k))).toFixed(2)}" fill="none" stroke="#fffdf2" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>`;
          });
          // астын сызу
          const k = clamp((t - 6.42) / 0.25, 0, 1);
          if (k > 0) s += `<path d="M118,592 Q300,584 498,594" pathLength="100" stroke-dasharray="100" stroke-dashoffset="${(100 * (1 - EASE.out(k))).toFixed(2)}" fill="none" stroke="#ffd166" stroke-width="9" stroke-linecap="round"/>`;
          return s;
        }
        function nearLayer() {
          // алдыңғы парта: глобус пен кітаптар (фотодағыдай)
          let s = "";
          s += `<path d="M-60,1640 L560,1660 L540,1760 L-60,1745 Z" fill="#e3a07f" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>`;
          s += `<path d="M-60,1745 L540,1760 L540,2000 L-60,2000 Z" fill="#c98463" stroke="${INK}" stroke-width="8" stroke-linejoin="round"/>`;
          s += `<rect x="100" y="1770" width="40" height="220" fill="#b8734f" stroke="${INK}" stroke-width="6"/>`;
          // кітаптар
          s += `<path d="M60,1620 L250,1626 L248,1660 L58,1654 Z" fill="#e9eef5" stroke="${INK}" stroke-width="6"/>`;
          s += `<path d="M66,1590 L246,1596 L244,1626 L64,1620 Z" fill="#5b8fd6" stroke="${INK}" stroke-width="6"/>`;
          s += `<path d="M58,1562 L240,1568 L238,1596 L56,1590 Z" fill="#f0f3f8" stroke="${INK}" stroke-width="6"/>`;
          // глобус
          s += `<path d="M150,1560 L150,1500 M115,1560 L185,1560" stroke="${INK}" stroke-width="8" stroke-linecap="round"/>`;
          s += `<circle cx="150" cy="1430" r="74" fill="#4fa3e3" stroke="${INK}" stroke-width="7"/>`;
          s += `<path d="M110,1395 Q135,1370 160,1390 Q150,1420 125,1430 Z M160,1440 Q190,1430 200,1460 Q180,1480 165,1470 Z" fill="#8cc152" stroke="${INK}" stroke-width="4"/>`;
          s += `<path d="M84,1470 Q150,1530 214,1400" fill="none" stroke="${INK}" stroke-width="7"/>`;
          return s;
        }
        const FAR = farLayer(), NEAR = nearLayer();

        // ---------- субтитр ----------
        const WORDS = [["Сәлем!", V0 + 0.14], ["Мен —", V0 + 0.86], ["Артур.", V0 + 1.3]];
        function captionAt(t) {
          if (t < WORDS[0][1] || t > 3.55) return "";
          const out = Math.min(1, (3.55 - t) / 0.15);
          let shown = WORDS.filter((w) => t >= w[1]);
          const txt = shown.map((w) => w[0]).join(" ");
          const lastK = clamp((t - shown[shown.length - 1][1]) / 0.12, 0, 1);
          const pop = 1 + 0.12 * (1 - EASE.out(lastK));
          return `<g transform="translate(540,1700) scale(${pop.toFixed(3)})" opacity="${out.toFixed(2)}"><text x="0" y="0" text-anchor="middle" font-weight="900" font-size="84" fill="#fff" stroke="${INK}" stroke-width="14" stroke-linejoin="round" paint-order="stroke">${txt}</text></g>`;
        }

        // ---------- бір кадр ----------
        function renderAt(t) {
          t = clamp(t, 0, DUR);
          const cs = key(t, CAM), px = key(t, PAN), fy = key(t, FY);
          let shx = 0, shy = 0;
          if (t > 3.8 && t < 4.4) {
            const d = 1 - (t - 3.8) / 0.6, q = Math.floor(t * 30);
            shx = ((q * 29) % 9 - 4) * 2.2 * d;
            shy = ((q * 41) % 7 - 3) * 2.2 * d;
          }
          const layer = (depth) => {
            const s = 1 + (cs - 1) * depth;
            return `translate(${(540 + (px + shx) * depth).toFixed(2)},${(fy + shy * depth).toFixed(2)}) scale(${s.toFixed(4)}) translate(-540,${-fy})`;
          };
          const seed = Math.floor(t * 12);
          const ch = R.draw(characterAt(t), { seed, id: "ar" });
          // кейіпкердің көлеңкесі (еденде)
          const jy = key(t, JY);
          const shadowK = 1 + jy / 220;
          svg.innerHTML =
            `<g transform="${layer(0.55)}">${FAR}${nameAt(t)}</g>` +
            `<g transform="${layer(1)}"><ellipse cx="650" cy="1652" rx="${(130 * shadowK).toFixed(1)}" ry="${(16 * shadowK).toFixed(1)}" fill="#000" opacity="${(0.16 * shadowK).toFixed(3)}"/>` +
            `<g transform="translate(650,1648) scale(1.1)">${ch}</g></g>` +
            `<g transform="${layer(1.45)}">${NEAR}</g>` +
            captionAt(t);
        }

        window.__renderAt = renderAt;
        window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
        renderAt(0);
        window.__timelines = window.__timelines || {};
        const proxy = { t: 0 };
        const tl = gsap.timeline({ paused: true });
        tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: () => renderAt(proxy.t) }, 0);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
